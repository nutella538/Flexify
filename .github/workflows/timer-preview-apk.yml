name: Side-by-side Flexify timer preview

on:
  push:
    branches:
      - feat/manual-workout-timer
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-apk:
    runs-on: ubuntu-latest
    env:
      FLEXIFY_TIMER_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup pinned Flutter SDK
        run: |
          git submodule update --init --recursive flutter
          chmod +x flutter/bin/*
          echo "$PWD/flutter/bin" >> "$GITHUB_PATH"
          flutter/bin/flutter config --no-analytics
      - name: Get dependencies
        run: flutter pub get
      - name: Generate database sources
        run: dart run build_runner build -d
      - name: Compile side-by-side debug APK
        run: flutter build apk --debug
      - name: Upload side-by-side APK
        uses: actions/upload-artifact@v4
        with:
          name: flexify-timer-preview-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
